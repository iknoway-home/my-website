<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iKnoWay — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../shared/human-polish.css" />
</head>
<body>

  <!-- ── Canvas: particle field ── -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- ── Scanlines overlay ── -->
  <div class="scanlines" aria-hidden="true"></div>

  <!-- ── Navigation ── -->
  <header class="site-header" id="site-header">
    <nav class="nav-inner">
      <span class="nav-logo">
        <span class="logo-bracket">[</span>
        iK
        <span class="logo-bracket">]</span>
      </span>
      <ul class="nav-links">
        <li><a href="#about">PROFILE</a></li>
        <li><a href="#anime">ANIME</a></li>
        <li><a href="#movies">MOVIES</a></li>
        <li><a href="#contact">CONTACT</a></li>
      </ul>
      <a href="../../index.html?switch=1" class="nav-switch">⟳ Theme Gacha</a>
    </nav>
  </header>

  <!-- ── Hero ── -->
  <section class="hero" id="top">
    <div class="speed-lines" aria-hidden="true"></div>

    <div class="deco-kanji" aria-hidden="true">
      <span class="kanji k1">推</span>
      <span class="kanji k2">愛</span>
      <span class="kanji k3">夢</span>
      <span class="kanji k4">魂</span>
      <span class="kanji k5">熱</span>
    </div>

    <div class="hero-inner">
      <div class="hero-overline">
        <span class="overline-dash"></span>
        <span id="hero-role-anime"></span>
        <span class="overline-dash"></span>
      </div>

      <h1 class="hero-title glitch-wrap">
        <span class="glitch" id="hero-name-anime" data-text="iKnoWay">iKnoWay</span>
      </h1>

      <p class="hero-sub">
        <span class="sub-jp" id="hero-tagline-jp"></span><br>
        <span class="sub-en" id="hero-tagline-en"></span>
      </p>

      <div class="hero-stats" id="hero-stats"></div>

      <div class="hero-btns">
        <a href="#contact" class="btn-ghost">CONTACT</a>
      </div>
    </div>

  </section>

  <!-- ── About ── -->
  <section class="section" id="about">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-tag">// 01</span>
        <h2 class="section-title">PROFILE<span class="title-jp">プロフィール</span></h2>
        <div class="header-line"></div>
      </div>
      <div class="about-grid">
        <div class="profile-card reveal">
          <div class="profile-id">
            <div class="id-data" id="profile-id-data"></div>
          </div>
        </div>

        <div class="about-panels reveal">
          <div class="panel">
            <h3 class="panel-title">「 ABOUT 」</h3>
            <div id="about-paragraphs-anime"></div>
          </div>
          <div class="trait-grid" id="trait-grid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Anime ── -->
  <section class="section section-dark" id="anime">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-tag">// 02</span>
        <h2 class="section-title">ANIME<span class="title-jp">推しアニメ</span></h2>
        <div class="header-line"></div>
      </div>
      <div class="works-grid" id="anime-grid"></div>
    </div>
  </section>

  <!-- ── Movies ── -->
  <section class="section" id="movies">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-tag">// 03</span>
        <h2 class="section-title">MOVIES<span class="title-jp">推し映画</span></h2>
        <div class="header-line"></div>
      </div>
      <div class="works-grid" id="movies-grid"></div>
    </div>
  </section>

  <!-- ── Contact ── -->
  <section class="section section-dark" id="contact">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-tag">// 04</span>
        <h2 class="section-title">CONTACT<span class="title-jp">連絡先</span></h2>
        <div class="header-line"></div>
      </div>
      <div class="contact-terminal reveal">
        <div class="terminal-bar">
          <span class="tb-dot red"></span>
          <span class="tb-dot yellow"></span>
          <span class="tb-dot green"></span>
          <span class="tb-title">contact.sh</span>
        </div>
        <div class="terminal-body">
          <p class="term-line">
            <span class="term-prompt">$</span>
            <span class="term-cmd typing-effect">./contact --send-message</span>
          </p>
          <p class="term-output" id="contact-message-anime"></p>
          <div class="term-socials" id="contact-social-anime"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p><span class="footer-bracket">[</span> iKnoWay &copy; 2026 <span class="footer-bracket">]</span> — ALL SYSTEMS OPERATIONAL</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/SplitText.min.js"></script>
  <script src="../../shared/utils.js"></script>
  <script src="../../shared/data.js"></script>
  <script src="../../shared/games.js"></script>
  <script src="../../shared/projects.js"></script>
  <script src="../../shared/snap.js"></script>
  <script src="script.js"></script>
</body>
</html>
